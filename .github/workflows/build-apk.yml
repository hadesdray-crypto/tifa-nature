# Crée l'APK signée de Tifa Nature. À lancer à la main : onglet « Actions » > « Créer l'APK » > « Run workflow ».
name: Créer l'APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Clés de signature (secret unique TIFA_KEYS)
        env:
          TIFA_KEYS: ${{ secrets.TIFA_KEYS }}
          KS4: ${{ secrets.TIFA_KEYSTORE_B64 }}
          KP4: ${{ secrets.TIFA_KEYSTORE_PASSWORD }}
          KA4: ${{ secrets.TIFA_KEY_ALIAS }}
          KK4: ${{ secrets.TIFA_KEY_PASSWORD }}
        run: |
          if [ -n "$TIFA_KEYS" ]; then
            PW=$(printf '%s\n' "$TIFA_KEYS" | sed -n 1p | tr -d '\r'); B64=$(printf '%s\n' "$TIFA_KEYS" | sed -n 2p | tr -d '\r')
            AL=tifa; KPW="$PW"
          else
            PW="$KP4"; B64="$KS4"; AL="$KA4"; KPW="${KK4:-$KP4}"
          fi
          if [ -z "$PW" ] || [ -z "$B64" ] || [ -z "$AL" ]; then
            echo "::error::Les clés de signature sont absentes : ajoutez le secret TIFA_KEYS (voir la marche à suivre). L'APK ne peut pas être signée."; exit 1
          fi
          echo "::add-mask::$PW"; echo "::add-mask::$B64"; echo "::add-mask::$KPW"
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/tifa.keystore"
          { echo "TIFA_KEYSTORE=$RUNNER_TEMP/tifa.keystore"; echo "TIFA_KEYSTORE_PASSWORD=$PW"; echo "TIFA_KEY_ALIAS=$AL"; echo "TIFA_KEY_PASSWORD=$KPW"; } >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/copy-vendor.js
      - name: Adresse des mises à jour sur place
        run: sed -i "s#__UPDATE_MANIFEST_URL__#https://raw.githubusercontent.com/${{ github.repository }}/ota/manifest.json#" www/js/config.js
      - name: Numéro de version
        id: v
        run: |
          echo "code=$(grep -oP 'VERSION_CODE:\s*\K[0-9]+' www/js/config.js)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP "VERSION_WEB:\s*'\K[^']+" www/js/config.js)" >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PtifaVersionCode=${{ steps.v.outputs.code }} -PtifaVersionName=${{ steps.v.outputs.name }}
      - name: Nommer l'APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/Tifa-Nature.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/Tifa-Nature.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: Tifa-Nature-APK, path: out/Tifa-Nature.apk }
      - name: Publier dans « Releases » (téléchargement facile depuis le téléphone)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/Tifa-Nature.apk --title "Tifa Nature ${{ steps.v.outputs.name }} (APK)" --notes "APK signée, version ${{ steps.v.outputs.name }}."
