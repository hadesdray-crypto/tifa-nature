# Publie la mise à jour « sur place » : à chaque modification de www/, le paquet est mis sur la branche « ota ».
name: Publier la mise à jour sur place
on:
  push:
    branches: [main]
    paths: ['www/**', 'update/**', 'scripts/build-ota.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/copy-vendor.js
      - run: node scripts/build-ota.js --out "$RUNNER_TEMP/ota" --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/ota/manifest.json"
      - name: Pousser sur la branche ota
        working-directory: ${{ runner.temp }}/ota
        run: |
          git init -q -b ota
          git config user.name "tifa-nature-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "Mise à jour $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ota
